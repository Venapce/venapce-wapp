<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venapce · Dashboard Builder</title>
    <!-- Brand mark. The owl is a flat single-colour glyph, so the tab icon needs
         one file per scheme: navy is unreadable on a dark tab strip (2.2:1) and
         the pale version vanishes on a light one (1.0:1). Browsers that ignore
         `media` on icon links fall back to the navy .ico. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)" href="/favicon-light-32.png" />
    <link rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)" href="/favicon-dark-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0e13" />
    <!-- UI type: Inter for the interface, JetBrains Mono for query/SQL payloads.
         Both degrade to the system stack in tailwind.config.js when offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
